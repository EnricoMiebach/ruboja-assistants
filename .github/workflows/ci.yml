name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: composer install --no-progress --prefer-dist
      - run: vendor/bin/phpcs

  tests:
    name: PHPUnit (WordPress latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - run: npm ci
      - run: composer install --no-progress --prefer-dist
      - run: npx wp-env start
      - run: npm run test:php

  package:
    name: Build plugin zip
    runs-on: ubuntu-latest
    needs: [php-lint, coding-standards, tests]
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ruboja-assistants
          path: dist/ruboja-assistants.zip
          retention-days: 14
